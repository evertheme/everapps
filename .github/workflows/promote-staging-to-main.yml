name: Promote staging → main

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  promote:
    name: Fast-forward main to staging and tag release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest branch and tag state
        run: git fetch origin --tags

      - name: Verify fast-forward is possible
        run: |
          STAGING_SHA=$(git rev-parse origin/staging)
          MAIN_SHA=$(git rev-parse origin/main)

          if [ "$STAGING_SHA" = "$MAIN_SHA" ]; then
            echo "main is already up to date with staging. Nothing to promote."
            exit 0
          fi

          if ! git merge-base --is-ancestor "$MAIN_SHA" "$STAGING_SHA"; then
            echo ""
            echo "ERROR: Fast-forward is not possible."
            echo "main has commits that are not in staging."
            echo ""
            echo "Run the following to investigate:"
            echo "  git log --oneline origin/staging..origin/main"
            echo ""
            echo "Fix the divergence before promoting."
            exit 1
          fi

          echo "Pre-flight check passed. main can be fast-forwarded to staging."

      - name: Calculate next version
        id: version
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
            echo "No existing tags found. Starting from $LATEST."
          else
            echo "Latest tag: $LATEST"
          fi

          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next version: $NEXT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists."
            echo "Choose a different bump type or delete the existing tag first."
            exit 1
          fi

      - name: Promote main to staging
        run: git push origin origin/staging:refs/heads/main

      - name: Create annotated release tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG" origin/staging
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Summary
        run: |
          MAIN_SHA=$(git rev-parse origin/main)
          echo "main promoted to: $MAIN_SHA"
          echo "Release tagged: ${{ steps.version.outputs.tag }}"
          echo "Railway production deployment triggered."
