name: Promote staging → main

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  promote:
    name: Promote staging to main via PR and tag release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest branch and tag state
        run: git fetch origin --tags

      - name: Check for changes to promote
        id: preflight
        run: |
          STAGING_TREE=$(git rev-parse origin/staging^{tree})
          MAIN_TREE=$(git rev-parse origin/main^{tree})

          if [ "$STAGING_TREE" = "$MAIN_TREE" ]; then
            echo "main already has the same content as staging. Nothing to promote."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pre-flight passed. main has new content to receive from staging."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate next version
        id: version
        if: steps.preflight.outputs.skip != 'true'
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
            echo "No existing tags found. Starting from $LATEST."
          else
            echo "Latest tag: $LATEST"
          fi

          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next version: $NEXT"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        if: steps.preflight.outputs.skip != 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists."
            echo "Choose a different bump type or delete the existing tag first."
            exit 1
          fi

      - name: Check for existing promotion PR
        id: existing-pr
        if: steps.preflight.outputs.skip != 'true'
        run: |
          PR_NUMBER=$(gh pr list \
            --base main \
            --head staging \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$PR_NUMBER" ]; then
            echo "Found existing open PR #$PR_NUMBER. Will merge it."
          else
            echo "No existing PR found. Will create one."
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create promotion PR
        id: create-pr
        if: steps.preflight.outputs.skip != 'true' && steps.existing-pr.outputs.number == ''
        run: |
          PR_NUMBER=$(gh pr create \
            --base main \
            --head staging \
            --title "chore: promote staging → main (${{ steps.version.outputs.tag }})" \
            --body "Automated promotion. Advancing main to match staging. Release: ${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            | grep -o '[0-9]*$')

          echo "Created PR #$PR_NUMBER"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Merge promotion PR
        if: steps.preflight.outputs.skip != 'true'
        run: |
          PR_NUMBER="${{ steps.existing-pr.outputs.number || steps.create-pr.outputs.number }}"
          echo "Merging PR #$PR_NUMBER"

          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch=false

      - name: Create annotated release tag
        if: steps.preflight.outputs.skip != 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git fetch origin --tags
          git tag -a "$TAG" -m "Release $TAG" origin/main
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.preflight.outputs.skip != 'true'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Summary
        run: |
          if [ "${{ steps.preflight.outputs.skip }}" = "true" ]; then
            echo "No promotion needed. main is already in sync with staging."
          else
            git fetch origin
            MAIN_SHA=$(git rev-parse origin/main)
            echo "main promoted to: $MAIN_SHA"
            echo "Release tagged: ${{ steps.version.outputs.tag }}"
            echo "Railway production deployment triggered."
          fi
