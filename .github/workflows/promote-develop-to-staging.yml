name: Promote develop → staging

on:
  workflow_dispatch:

jobs:
  promote:
    name: Promote develop to staging via PR
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Fetch latest branch state
        run: git fetch origin

      - name: Check for changes to promote
        id: preflight
        run: |
          DEVELOP_TREE=$(git rev-parse origin/develop^{tree})
          STAGING_TREE=$(git rev-parse origin/staging^{tree})

          if [ "$DEVELOP_TREE" = "$STAGING_TREE" ]; then
            echo "staging already has the same content as develop. Nothing to promote."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(git rev-list origin/staging..origin/develop --count)
            echo "Pre-flight passed. staging will receive $COUNT new commit(s) from develop."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing promotion PR
        id: existing-pr
        if: steps.preflight.outputs.skip != 'true'
        run: |
          PR_NUMBER=$(gh pr list \
            --base staging \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$PR_NUMBER" ]; then
            echo "Found existing open PR #$PR_NUMBER. Will merge it."
          else
            echo "No existing PR found. Will create one."
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create promotion PR
        id: create-pr
        if: steps.preflight.outputs.skip != 'true' && steps.existing-pr.outputs.number == ''
        run: |
          PR_NUMBER=$(gh pr create \
            --base staging \
            --head develop \
            --title "chore: promote develop → staging" \
            --body "Automated promotion. Advancing staging to match develop." \
            --repo "$GITHUB_REPOSITORY" \
            | grep -o '[0-9]*$')

          echo "Created PR #$PR_NUMBER"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Merge promotion PR
        if: steps.preflight.outputs.skip != 'true'
        run: |
          PR_NUMBER="${{ steps.existing-pr.outputs.number || steps.create-pr.outputs.number }}"
          echo "Merging PR #$PR_NUMBER"

          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch=false

      - name: Summary
        run: |
          if [ "${{ steps.preflight.outputs.skip }}" = "true" ]; then
            echo "No promotion needed. staging is already in sync with develop."
          else
            git fetch origin
            STAGING_SHA=$(git rev-parse origin/staging)
            echo "staging promoted to: $STAGING_SHA"
            echo "Railway staging deployment triggered."
          fi
